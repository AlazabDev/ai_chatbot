name: CI

on:
  push:
    branches:
      - main
      - "production-hardening-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install static checker
        run: python -m pip install --disable-pip-version-check "ruff==0.14.10"

      - name: Validate repository contracts
        run: python scripts/validate_repo.py

      - name: Compile Python
        run: python -m compileall -q ai_chatbot

      - name: Ruff critical checks
        run: ruff check ai_chatbot scripts --select E9,F63,F7,F82

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Production build
        run: yarn --cwd frontend build
